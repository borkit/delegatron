[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delegatron"
version = "0.3.0"
description = "Multi-agent code bootstrap pipeline — generates new code from prompts"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
authors = [
    { name = "StoriaBrevi LLC", email = "info@storiabrevi.com" },
]
keywords = ["ai", "agents", "multi-agent", "coding", "pipeline", "llm", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "gitpython>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "tree-sitter-language-pack>=1.0.0",
]

[project.optional-dependencies]
e2b = [
    "e2b-code-interpreter>=1.0.0",
]
cloud-providers = [
    "anthropic>=0.40.0",
    "google-genai>=1.22.0",  # first release with GenerateContentConfig.response_json_schema
]
swebench = [
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
delegatron = "delegatron.cli:main"

[project.urls]
Homepage = "https://delegatron.com"
Repository = "https://github.com/borkit/delegatron"
Documentation = "https://delegatron.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/delegatron"]
# NOTE: Dashboard (Next.js) is intentionally NOT included in the wheel.
# It requires Node.js to run (next start) and is ~100MB+ of build artifacts.
# For installed deployments, run `cd dashboard && npm install && npm run build`
# separately. The `start-dashboard.bat` script handles this automatically.

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "delegatron/prompts"
"templates" = "delegatron/templates"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/delegatron/server/app.py" = ["B008"]  # Depends() in FastAPI signatures is standard

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "delegatron.cli"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "delegatron.server.app"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (runs full pipeline, ~60s+). Excluded by default.",
]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["delegatron"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
